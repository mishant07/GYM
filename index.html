<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Twenty - Hourly gym booking preview. Reserve your mat, get your code, and check in.">
<title>Twenty · Gym Session Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const DEMO = true;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const POLL_MS = 5000;
class ApiError extends Error { constructor(e, status) { super(e.message); this.code = e.code; this.details = e.details; this.status = status; } }

let token = localStorage.getItem('token');
let me = JSON.parse(localStorage.getItem('me') || 'null');
/*API_START*/
// PREVIEW ONLY: an in-browser stand-in for the real server so the page works without a backend.
const MOCK = (() => {
  const KEY = 'twenty-preview-v2', H = 3600000, AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const code = () => Array.from({ length: 6 }, () => AL[Math.floor(Math.random() * 32)]).join('');
  const ymdL = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const at = (off, h) => { const d = new Date(); d.setHours(h, 0, 0, 0); d.setDate(d.getDate() + off); return d.getTime(); };
  let db;
  function seed() {
    const s = { n: 100, users: [], sessions: [], bookings: [], waitlist: [], day: ymdL(Date.now()) };
    const u = (name, email, pw, role = 'member') => { const x = { id: ++s.n, name, email, pw, role }; s.users.push(x); return x; };
    const admin = u('Gym Admin', 'admin@gym.test', 'AdminPass123', 'admin'), alice = u('Alice Member', 'alice@gym.test', 'MemberPass123'), bob = u('Bob Member', 'bob@gym.test', 'MemberPass123');
    const names = ['Priya', 'Rahul', 'Meera', 'Arjun', 'Sana', 'Kabir', 'Isha', 'Dev', 'Nisha', 'Vikram', 'Anaya', 'Rohan', 'Tara', 'Karan', 'Zoya', 'Aditya', 'Diya', 'Imran', 'Lata', 'Neel'];
    const fill = names.map((n, i) => u(n + ' Kapoor'.replace('Kapoor', ['Shah', 'Rao', 'Iyer', 'Das', 'Khan'][i % 5]), `${n.toLowerCase()}@mail.test`, 'x'));
    const sess = (t) => { const x = { id: s.sessions.length + 1, starts_at: t, date: ymdL(t), hour: new Date(t).getHours(), capacity: 20 }; s.sessions.push(x); return x; };
    const book = (se, user, extra = {}) => s.bookings.push({ id: s.bookings.length + 1, session_id: se.id, user_id: user.id, status: 'confirmed', code: code(), checked_in_at: null, ...extra });
    const nowH = new Date(); nowH.setMinutes(0, 0, 0);
    const live = sess(nowH.getTime()); [alice, bob, ...fill.slice(0, 7)].forEach((x) => book(live, x));
    sess(nowH.getTime() + 2 * H); sess(nowH.getTime() + 3 * H);
    sess(at(1, 7)); sess(at(1, 9)); const few = sess(at(1, 18)); fill.slice(0, 18).forEach((x) => book(few, x));
    const full = sess(at(1, 19)); fill.forEach((x) => book(full, x)); s.waitlist.push({ id: 1, session_id: full.id, user_id: bob.id });
    sess(at(2, 7)); sess(at(2, 18)); sess(at(3, 12)); sess(at(4, 8)); sess(at(5, 17));
    return s;
  }
  const ensureLiveSession = () => {
    const now = Date.now();
    const curHour = new Date(); curHour.setMinutes(0, 0, 0, 0);
    const curTime = curHour.getTime();
    if (!db.sessions.some((s) => s.starts_at <= now && now < s.starts_at + H)) {
      const nextId = db.sessions.reduce((m, s) => Math.max(m, s.id || 0), 0) + 1;
      const live = { id: nextId, starts_at: curTime, date: ymdL(curTime), hour: curHour.getHours(), capacity: 20 };
      db.sessions.push(live);
      const regularUsers = db.users.filter((u) => u.role !== 'admin');
      regularUsers.slice(0, 8).forEach((u) => {
        const nextBId = db.bookings.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1;
        db.bookings.push({ id: nextBId, session_id: live.id, user_id: u.id, status: 'confirmed', code: code(), checked_in_at: null });
      });
      save();
    }
  };
  const load = () => {
    try {
      const x = JSON.parse(localStorage.getItem(KEY));
      if (x && x.day === ymdL(Date.now())) { db = x; ensureLiveSession(); return db; }
    } catch {}
    db = seed();
    save();
    return db;
  };
  const save = () => localStorage.setItem(KEY, JSON.stringify(db));
  const err = (status, code_, message, details) => { throw new ApiError({ code: code_, message, details }, status); };
  const seats = (id) => db.bookings.filter((b) => b.session_id === id && b.status === 'confirmed').length;
  const view = (s, uid) => {
    const mine = db.bookings.find((b) => b.session_id === s.id && b.user_id === uid && b.status === 'confirmed');
    const wl = db.waitlist.filter((w) => w.session_id === s.id), idx = wl.findIndex((w) => w.user_id === uid);
    const now = Date.now();
    const isStarted = s.starts_at <= now && now < s.starts_at + H;
    const isEnded = s.starts_at + H <= now;
    return { id: s.id, date: s.date, hour: s.hour, starts_at: s.starts_at, capacity: s.capacity, seats_left: s.capacity - seats(s.id), started: isStarted, ended: isEnded,
      my_booking: mine ? { id: mine.id, code: mine.code } : null, waitlist_position: idx >= 0 ? idx + 1 : null, waitlist_size: wl.length };
  };
  const promote = (s) => { while (s.starts_at > Date.now() && seats(s.id) < s.capacity) { const w = db.waitlist.find((x) => x.session_id === s.id); if (!w) break; db.waitlist = db.waitlist.filter((x) => x !== w); const nextBId = db.bookings.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1; db.bookings.push({ id: nextBId, session_id: s.id, user_id: w.user_id, status: 'confirmed', code: code(), checked_in_at: null }); } };
  return async function (path, method, body) {
    await new Promise((r) => setTimeout(r, 350));
    db = load();
    let match;
    const [p, qs] = path.split('?'), q = new URLSearchParams(qs || ''), m = (re) => p.match(re);
    if (p === '/auth/login') {
      const u = db.users.find((x) => x.email === (body.email || '').toLowerCase());
      if (!u || u.pw !== body.password) err(401, 'invalid_credentials', 'Incorrect email or password.');
      return { token: 'demo-' + u.id, user: { id: u.id, name: u.name, email: u.email, role: u.role } };
    }
    if (p === '/auth/register') {
      const email = (body.email || '').toLowerCase();
      if (db.users.some((x) => x.email === email)) err(409, 'email_taken', 'That email is already registered.');
      const u = { id: ++db.n, name: body.name, email, pw: body.password, role: 'member' }; db.users.push(u); save();
      return { token: 'demo-' + u.id, user: { id: u.id, name: u.name, email, role: 'member' } };
    }
    const user = db.users.find((x) => 'demo-' + x.id === token); if (!user) err(401, 'unauthenticated', 'Log in again.');
    const admin = () => { if (user.role !== 'admin') err(403, 'forbidden', 'Admins only.'); };
    let r;
    if (p === '/sessions' && method === 'GET') {
      const list = db.sessions.filter((s) => (q.get('all') ? true : q.get('date') ? s.date === q.get('date') : s.starts_at + H > Date.now())).sort((a, b) => a.starts_at - b.starts_at);
      r = { sessions: list.map((s) => view(s, user.id)) };
    } else if (p === '/sessions' && method === 'POST') {
      admin(); const t = new Date(body.date + 'T00:00:00'); t.setHours(body.hour); const ts = t.getTime();
      if (ts <= Date.now()) err(422, 'validation_error', 'Session must start in the future.');
      if (db.sessions.some((s) => s.starts_at === ts)) err(409, 'slot_taken', 'A session already starts at that time.');
      const nextId = db.sessions.reduce((m, s) => Math.max(m, s.id || 0), 0) + 1;
      const sessObj = { id: nextId, starts_at: ts, date: ymdL(ts), hour: body.hour, capacity: 20 }; db.sessions.push(sessObj); r = { session: sessObj };
    } else if ((match = m(/^\/sessions\/(\d+)\/bookings$/)) && method === 'POST') {
      const s = db.sessions.find((y) => y.id === +match[1]); if (!s) err(404, 'not_found', 'Session not found.');
      if (s.starts_at <= Date.now()) err(409, 'session_started', 'This session has already started or ended.');
      if (db.bookings.some((b) => b.session_id === s.id && b.user_id === user.id && b.status === 'confirmed')) err(409, 'already_booked', 'You already have a booking for this session.');
      if (seats(s.id) >= s.capacity) err(409, 'session_full', 'This session is full. Someone just took the last mat.');
      const nextBId = db.bookings.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1;
      const b = { id: nextBId, session_id: s.id, user_id: user.id, status: 'confirmed', code: code(), checked_in_at: null };
      db.bookings.push(b); db.waitlist = db.waitlist.filter((w) => !(w.session_id === s.id && w.user_id === user.id)); r = { booking: b };
    } else if ((match = m(/^\/sessions\/(\d+)\/waitlist$/))) {
      const s = db.sessions.find((y) => y.id === +match[1]); if (!s) err(404, 'not_found', 'Session not found.');
      const has = db.waitlist.find((w) => w.session_id === s.id && w.user_id === user.id);
      if (method === 'POST') {
        if (s.starts_at <= Date.now()) err(409, 'session_started', 'This session has already started or ended.');
        if (seats(s.id) < s.capacity) err(409, 'seats_available', 'Mats are free, book one instead.');
        if (has) err(409, 'already_waitlisted', 'You are already on the waitlist.');
        db.waitlist.push({ id: Date.now(), session_id: s.id, user_id: user.id }); r = { session: view(s, user.id) };
      } else { if (!has) err(404, 'not_found', 'Waitlist entry not found.'); db.waitlist = db.waitlist.filter((w) => w !== has); r = { left: true }; }
    } else if ((match = m(/^\/bookings\/(\d+)$/)) && method === 'DELETE') {
      const b = db.bookings.find((y) => y.id === +match[1] && y.user_id === user.id); if (!b) err(404, 'not_found', 'Booking not found.');
      const s = db.sessions.find((y) => y.id === b.session_id);
      if (b.status === 'cancelled') err(409, 'already_cancelled', 'Booking is already cancelled.');
      if (s.starts_at <= Date.now()) err(409, 'session_started', 'You cannot cancel after the session has started.');
      b.status = 'cancelled'; promote(s); r = { cancelled: true };
    } else if (p === '/bookings/mine') {
      const j = (b) => { const s = db.sessions.find((y) => y.id === b.session_id); return { id: b.id, code: b.code, status: b.status, checked_in_at: b.checked_in_at, session_id: s.id, date: s.date, hour: s.hour, starts_at: s.starts_at }; };
      r = { bookings: db.bookings.filter((b) => b.user_id === user.id).map(j).sort((a, b) => b.starts_at - a.starts_at),
        waitlist: db.waitlist.filter((w) => w.user_id === user.id).map((w) => { const s = db.sessions.find((y) => y.id === w.session_id); return { session_id: s.id, date: s.date, hour: s.hour, starts_at: s.starts_at, position: db.waitlist.filter((z) => z.session_id === s.id).findIndex((z) => z === w) + 1 }; }) };
    } else if ((match = m(/^\/admin\/sessions\/(\d+)\/bookings$/))) {
      admin(); const s = db.sessions.find((y) => y.id === +match[1]); if (!s) err(404, 'not_found', 'Session not found.');
      r = { session: view(s, 0), bookings: db.bookings.filter((b) => b.session_id === s.id).map((b) => { const u = db.users.find((z) => z.id === b.user_id); return { id: b.id, status: b.status, code: b.code, checked_in_at: b.checked_in_at, name: u.name, email: u.email }; }) };
    } else if (p === '/admin/checkin') {
      admin(); const b = db.bookings.find((y) => y.code === String(body.code).toUpperCase()); if (!b) err(404, 'not_found', 'No booking has that code.');
      const s = db.sessions.find((y) => y.id === b.session_id), u = db.users.find((z) => z.id === b.user_id), t = Date.now();
      if (b.status === 'cancelled') err(409, 'booking_cancelled', 'That booking was cancelled.');
      if (b.checked_in_at) err(409, 'already_checked_in', `${u.name} is already checked in.`);
      if (t < s.starts_at || t >= s.starts_at + H) err(409, 'outside_session_hour', 'This code only works during its session hour.');
      b.checked_in_at = t; r = { member: { name: u.name, email: u.email }, session: { id: s.id, date: s.date, hour: s.hour } };
    } else err(404, 'not_found', 'Route not found.');
    save(); return r;
  };
})();
const request = (path, method, body) => MOCK(path, method, body);
/*API_END*/

async function api(path, method = 'GET', body) {
  try { return await request(path, method, body); }
  catch (e) { if (e.status === 401 && token) logout(); throw e; }
}
function setAuth(d) { token = d.token; me = d.user; localStorage.setItem('token', token); localStorage.setItem('me', JSON.stringify(me)); }
function logout() { token = null; me = null; localStorage.removeItem('token'); localStorage.removeItem('me'); if (location.hash === '#/login') router(); else location.hash = '#/login'; }
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 't' + (bad ? ' bad' : ''); t.textContent = msg;
  $('#toast').append(t); setTimeout(() => t.remove(), 4000);
}

const hourLabel = (h) => `${pad(h)}:00`;
function dayName(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const t = new Date(d + 'T00:00:00'); const diff = Math.round((t - today) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow';
  return t.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
}
const shortDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const ymd = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

const app = $('#app');
let pollTimer = null, pending = 0;
const ROUTES = { '/login': { public: true }, '/sessions': {}, '/bookings': {}, '/admin': { admin: true } };

function shell(inner, path) {
  const link = (p, t) => `<a href="#${p}" ${path === p ? 'aria-current="page"' : ''}>${t}</a>`;
  app.innerHTML = `<header class="top"><div class="top-in">
    <a class="brand" href="#/sessions">${logo()}twenty</a>
    <nav class="nav" aria-label="Main">${link('/sessions', 'Sessions')}${link('/bookings', 'My bookings')}${me?.role === 'admin' ? link('/admin', 'Admin') : ''}
    <span class="who">${esc(me?.name || 'Member')}</span><button class="btn quiet sm" id="logout">Log out</button></nav></div></header>
    <main id="main" tabindex="-1">${inner}</main>`;
  $('#logout').onclick = logout;
}
const logo = () => `<svg viewBox="0 0 26 26" aria-hidden="true"><g fill="currentColor">${[0, 1, 2].map((r) => [0, 1].map((c) => `<rect x="${c * 13 + 1}" y="${r * 8.5 + 1}" width="11" height="6" rx="2"/>`).join('')).join('')}</g></svg>`;

function router() {
  clearInterval(pollTimer); pollTimer = null;
  const path = location.hash.slice(1) || '/sessions';
  const r = ROUTES[path];
  if (!r) return void (location.hash = '#/sessions');
  if (!r.public && (!token || !me)) return void (location.hash = '#/login');   // client guards; the server enforces them again
  if (r.public && token) return void (location.hash = '#/sessions');
  if (r.admin && me?.role !== 'admin') return void (location.hash = '#/sessions');
  ({ '/login': loginPage, '/sessions': sessionsPage, '/bookings': bookingsPage, '/admin': adminPage })[path]();
  $('#main')?.focus({ preventScroll: true });
}
window.addEventListener('hashchange', router);
const startPolling = (fn) => { pollTimer = setInterval(() => { if (!pending && !document.hidden) fn(); }, POLL_MS); };
const notice = (title, text, retry) => `<div class="notice"><b>${esc(title)}</b>${esc(text)}${retry ? '<div style="margin-top:1rem"><button class="btn" id="retry">Try again</button></div>' : ''}</div>`;
const skeleton = () => '<div aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><p class="sr">Loading</p>';

function loginPage() {
  let mode = 'login';
  const showErr = (errs) => {
    for (const f of ['name', 'email', 'password']) { const el = $('#' + f); if (!el) continue; $('#' + f + '-e').textContent = errs[f] ? 'Problem: ' + errs[f] : ''; el.setAttribute('aria-invalid', !!errs[f]); }
  };
  const submit = async (payload) => {
    const btn = $('#submit'); if (btn) btn.disabled = true;
    showErr({}); $('#form-e').textContent = '';
    try { setAuth(await api(mode === 'register' ? '/auth/register' : '/auth/login', 'POST', payload)); if (location.hash === '#/sessions') router(); else location.hash = '#/sessions'; }
    catch (e) { showErr(e.details || {}); $('#form-e').textContent = 'Problem: ' + e.message; }
    finally { if (btn) btn.disabled = false; }
  };
  const draw = () => {
    const reg = mode === 'register';
    const mats = Array.from({ length: 20 }, (_, i) => `<i class="${i < 13 ? (i === 12 ? 'y' : 'f') : ''}" style="animation-delay:${0.3 + i * 0.07}s"></i>`).join('');
    app.innerHTML = `<div class="auth"><section class="auth-art"><a class="brand" href="#/login">${logo()}twenty</a>
      <div><h1>Twenty mats. One hour. Your spot.</h1><p>Book an hourly session, get a code, show it at the door.</p></div>
      <div class="art-mats" aria-hidden="true">${mats}</div></section>
      <section class="auth-form"><main class="auth-box" id="main" tabindex="-1">
        <h2>${reg ? 'Create your account' : 'Welcome back'}</h2>
        <div class="seg" role="group" aria-label="Choose form"><button type="button" data-m="login" aria-pressed="${!reg}">Log in</button><button type="button" data-m="register" aria-pressed="${reg}">Register</button></div>
        <form id="f" novalidate>
          ${reg ? `<label for="name">Full name</label><input id="name" autocomplete="name" aria-describedby="name-e"><p class="field-err" id="name-e"></p>` : ''}
          <label for="email">Email</label><input id="email" type="email" autocomplete="email" aria-describedby="email-e"><p class="field-err" id="email-e"></p>
          <label for="password">Password</label><input id="password" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" aria-describedby="password-e"><p class="field-err" id="password-e"></p>
          ${reg ? '<p class="sub">At least 8 characters.</p>' : ''}
          <p class="field-err" id="form-e" role="alert"></p>
          <button class="btn primary" id="submit" style="width:100%;margin-top:.5rem">${reg ? 'Create account' : 'Log in'}</button>
        </form>
        ${DEMO ? `<div class="demo"><p>Preview mode, no server needed. Pick an account:</p>
          <button class="btn sm" data-demo="admin@gym.test|AdminPass123">Admin</button><button class="btn sm" data-demo="alice@gym.test|MemberPass123">Member (Alice)</button><button class="btn sm" data-demo="bob@gym.test|MemberPass123">Member (Bob)</button></div>` : ''}
      </main></section></div>`;
    app.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { mode = b.dataset.m; draw(); });
    app.querySelectorAll('[data-demo]').forEach((b) => b.onclick = () => { const [e, p] = b.dataset.demo.split('|'); mode = 'login'; submit({ email: e, password: p }); });
    $('#f').onsubmit = (ev) => {
      ev.preventDefault();
      const v = { name: $('#name')?.value.trim(), email: $('#email').value.trim(), password: $('#password').value };
      const errs = {};
      if (reg && !v.name) errs.name = 'Enter your name.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) errs.email = 'Enter a valid email address, like name@example.com.';
      if (!v.password) errs.password = 'Enter your password.'; else if (reg && v.password.length < 8) errs.password = 'Use at least 8 characters.';
      showErr(errs); if (Object.keys(errs).length) return void $('[aria-invalid="true"]')?.focus();
      submit(reg ? v : { email: v.email, password: v.password });
    };
  };
  draw();
}

let sessions = [], sState = 'loading', sErr = '', dateFilter = '', flash = {};
function sessionsPage() {
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
  shell(`<div class="head"><h1>Book a mat</h1><p>Hourly sessions with twenty mats each. Pick a day, grab a mat, and your check-in code appears right away.</p></div>
    <div class="days" role="group" aria-label="Filter by day">
      <button class="day" data-d="" aria-pressed="${!dateFilter}"><b>All</b><span>upcoming</span></button>
      ${days.map((d) => `<button class="day" data-d="${ymd(d)}" aria-pressed="${dateFilter === ymd(d)}"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined, { weekday: 'short' })}</span></button>`).join('')}</div>
    <div id="list" aria-live="polite"></div>`, '/sessions');
  $('.days').onclick = (e) => {
    const b = e.target.closest('.day'); if (!b) return;
    dateFilter = b.dataset.d; document.querySelectorAll('.day').forEach((x) => x.setAttribute('aria-pressed', x === b)); loadSessions();
  };
  $('#list').onclick = onSessionAction;
  loadSessions(); startPolling(() => loadSessions(true));
}
async function loadSessions(quiet) {
  if (!quiet) { sState = 'loading'; drawSessions(); }
  try { sessions = (await api('/sessions' + (dateFilter ? `?date=${dateFilter}` : ''))).sessions; sState = 'ok'; }
  catch (e) { if (!quiet || sState !== 'ok') { sState = 'error'; sErr = e.message; } }
  drawSessions();
}
function drawSessions() {
  const list = $('#list'); if (!list) return;
  const a = document.activeElement, focus = a?.dataset?.act ? `[data-act="${a.dataset.act}"][data-id="${a.dataset.id}"]` : null;
  if (sState === 'loading') list.innerHTML = skeleton();
  else if (sState === 'error') { list.innerHTML = notice('Could not load sessions', sErr, true); $('#retry').onclick = () => loadSessions(); }
  else if (!sessions.length) list.innerHTML = notice('No sessions here yet', dateFilter ? 'Nothing is scheduled for this day. Try another day or view all upcoming sessions.' : 'The gym has not scheduled any upcoming sessions.');
  else {
    let last = '', html = '';
    for (const s of sessions) { if (s.date !== last) { html += `<h2 class="day-label">${esc(dayName(s.date))}</h2>`; last = s.date; } html += sessionRow(s); }
    list.innerHTML = html;
  }
  if (focus) $(focus, list)?.focus();
}
function sessionRow(s) {
  const taken = s.capacity - s.seats_left, full = s.seats_left <= 0, id = s.id;
  const mats = Array.from({ length: s.capacity }, (_, i) => `<i class="mat ${i < taken ? 'on' : ''} ${s.my_booking && i === taken - 1 ? 'me' : ''}"></i>`).join('');
  let state, act = '', extra = '';
  if (s.my_booking) {
    state = '<span class="state ok">You are in</span>';
    extra = `<div class="ticket"><small>Check-in code</small><span class="code">${esc(s.my_booking.code)}</span></div>`;
    if (!s.started && !s.ended) act = `<button class="btn" data-act="cancel" data-id="${id}">Cancel booking</button>`;
  } else if (s.waitlist_position) {
    state = `<span class="state warn">You are ${ordinal(s.waitlist_position)} in line</span>`;
    act = `<button class="btn" data-act="leave" data-id="${id}">Leave waitlist</button>`;
  } else if (s.started) state = '<span class="state warn">In progress</span>';
  else if (s.ended) state = '<span class="state">Ended</span>';
  else if (full) { state = `<span class="state">Full</span> <span class="sub">${s.waitlist_size} waiting</span>`; act = `<button class="btn" data-act="waitlist" data-id="${id}">Join waitlist</button>`; }
  else { state = `<span class="state ${s.seats_left <= 3 ? 'warn' : ''}">${s.seats_left <= 3 ? 'Only ' : ''}${s.seats_left} ${s.seats_left === 1 ? 'mat' : 'mats'} left</span>`; act = `<button class="btn primary" data-act="book" data-id="${id}">Book a mat</button>`; }
  return `<article class="row" aria-label="${esc(dayName(s.date))} at ${hourLabel(s.hour)}">
    <div class="time">${hourLabel(s.hour)}<small>1 hour</small></div>
    <div><div class="mats" aria-hidden="true">${mats}</div><div>${state}</div>${extra}<p class="err" role="alert">${esc(flash[id] || '')}</p></div>
    <div class="act">${act}</div></article>`;
}
async function onSessionAction(e) {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = Number(btn.dataset.id), act = btn.dataset.act, s = sessions.find((x) => x.id === id); if (!s) return;
  if (act === 'cancel' && !s.my_booking?.id) return;      // still a placeholder; wait for the server
  const snap = JSON.parse(JSON.stringify(s)); flash[id] = ''; pending++; btn.disabled = true;
  // Optimistic: show the result now, roll back if the server says no.
  if (act === 'book') { s.seats_left--; s.my_booking = { id: 0, code: '······' }; }
  if (act === 'cancel') { s.seats_left++; s.my_booking = null; }
  if (act === 'waitlist') { s.waitlist_size++; s.waitlist_position = s.waitlist_size; }
  if (act === 'leave') { s.waitlist_size--; s.waitlist_position = null; }
  drawSessions();
  try {
    if (act === 'book') { const d = await api(`/sessions/${id}/bookings`, 'POST'); toast(`Booked. Your code is ${d.booking.code}`); }
    if (act === 'cancel') { await api(`/bookings/${snap.my_booking.id}`, 'DELETE'); toast('Booking cancelled'); }
    if (act === 'waitlist') { await api(`/sessions/${id}/waitlist`, 'POST'); toast('You joined the waitlist'); }
    if (act === 'leave') { await api(`/sessions/${id}/waitlist`, 'DELETE'); toast('You left the waitlist'); }
  } catch (err) { Object.assign(s, snap); flash[id] = err.message; toast(err.message, true); }
  finally { pending--; }
  await loadSessions(true);
}

let mine = { bookings: [], waitlist: [] }, mState = 'loading', mErr = '';
function bookingsPage() {
  shell('<div class="head"><h1>My bookings</h1><p>Show your code to the staff at the door. Waitlist spots turn into bookings automatically.</p></div><div id="list" aria-live="polite"></div>', '/bookings');
  $('#list').onclick = async (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    pending++; b.disabled = true;
    try { b.dataset.act === 'cancel' ? await api(`/bookings/${b.dataset.id}`, 'DELETE') : await api(`/sessions/${b.dataset.id}/waitlist`, 'DELETE'); toast(b.dataset.act === 'cancel' ? 'Booking cancelled' : 'You left the waitlist'); }
    catch (err) { toast(err.message, true); }
    finally { pending--; }
    loadMine(true);
  };
  loadMine(); startPolling(() => loadMine(true));
}
async function loadMine(quiet) {
  if (!quiet) { mState = 'loading'; drawMine(); }
  try { mine = await api('/bookings/mine'); mState = 'ok'; } catch (e) { if (!quiet || mState !== 'ok') { mState = 'error'; mErr = e.message; } }
  drawMine();
}
function drawMine() {
  const list = $('#list'); if (!list) return;
  if (mState === 'loading') return void (list.innerHTML = skeleton());
  if (mState === 'error') { list.innerHTML = notice('Could not load your bookings', mErr, true); return void ($('#retry').onclick = () => loadMine()); }
  const now = Date.now(), up = mine.bookings.filter((b) => b.status === 'confirmed' && b.starts_at + 3600000 > now), past = mine.bookings.filter((b) => !up.includes(b));
  if (!up.length && !mine.waitlist.length && !past.length) return void (list.innerHTML = notice('Nothing booked yet', 'Pick a session and it will show up here with its check-in code.') + '<p style="text-align:center;margin-top:1rem"><a class="btn primary" href="#/sessions">Browse sessions</a></p>');
  const stub = (b, can) => `<article class="stub ${b.status === 'cancelled' || b.checked_in_at ? 'dim' : ''}"><div><h3>${esc(dayName(b.date))}, ${hourLabel(b.hour)}</h3>
    ${b.status === 'cancelled' ? '<span class="pill bad">Cancelled</span>' : b.checked_in_at ? '<span class="pill ok">Checked in</span>' : `<div class="sub">Check-in code</div><div class="code">${esc(b.code)}</div>`}</div>
    ${can && b.starts_at > now ? `<button class="btn" data-act="cancel" data-id="${b.id}">Cancel</button>` : ''}</article>`;
  list.innerHTML = `<h2 class="day-label">Upcoming</h2>${up.map((b) => stub(b, true)).join('') || '<p class="sub">No upcoming bookings.</p>'}
    <h2 class="day-label">Waitlist</h2>${mine.waitlist.map((w) => `<article class="stub"><div><h3>${esc(dayName(w.date))}, ${hourLabel(w.hour)}</h3><span class="pill warn">${ordinal(w.position)} in line</span></div><button class="btn" data-act="leave" data-id="${w.session_id}">Leave waitlist</button></article>`).join('') || '<p class="sub">You are not on any waitlist.</p>'}
    ${past.length ? `<h2 class="day-label">History</h2>${past.map((b) => stub(b, false)).join('')}` : ''}`;
}

let adminSel = '';
async function adminPage() {
  shell(`<div class="head"><h1>Admin</h1><p>Create sessions, see who is booked, and check members in at the door.</p></div>
    <div class="grid2">
      <section class="panel" aria-labelledby="h1a"><h2 id="h1a">Create a session</h2>
        <form id="create" novalidate><div class="two">
          <div><label for="c-date">Date</label><input id="c-date" type="date" value="${ymd(new Date())}" min="${ymd(new Date())}" aria-describedby="c-date-e"><p class="field-err" id="c-date-e"></p></div>
          <div><label for="c-hour">Start hour (0 to 23)</label><input id="c-hour" type="number" min="0" max="23" value="${(new Date().getHours() + 1) % 24}" inputmode="numeric" aria-describedby="c-hour-e"><p class="field-err" id="c-hour-e"></p></div></div>
          <p class="sub">Sessions last one hour and hold 20 people.</p>
          <button class="btn primary" id="c-btn" style="margin-top:.75rem">Create session</button><p class="field-err" id="c-msg" role="alert"></p></form></section>
      <section class="panel" aria-labelledby="h2a"><h2 id="h2a">Check a member in</h2>
        <form id="check" novalidate><label for="code">Booking code</label><input id="code" class="big-code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-e"><p class="field-err" id="code-e"></p>
          <button class="btn primary" id="k-btn" style="width:100%">Check in</button></form><div id="k-res" role="alert"></div>${DEMO ? '<p class="sub" id="demo-hint" style="margin-top:.75rem"></p>' : ''}</section></div>
    <section class="panel" aria-labelledby="h3a"><h2 id="h3a">Session bookings</h2><label for="pick">Session</label><select id="pick"><option>Loading…</option></select><div id="bk" style="margin-top:1rem" aria-live="polite"></div></section>`, '/admin');
  $('#create').onsubmit = createSession; $('#check').onsubmit = checkIn;
  $('#pick').onchange = (e) => { adminSel = e.target.value; loadBookings(); };
  await loadAdminSessions(); startPolling(() => loadBookings(true));
}
async function loadAdminSessions() {
  const pick = $('#pick');
  try {
    const list = (await api('/sessions?all=1')).sessions;
    pick.innerHTML = list.length ? list.map((s) => `<option value="${s.id}">${esc(shortDate(s.date))}, ${hourLabel(s.hour)}${s.started ? ' (in progress)' : s.ended ? ' (ended)' : ''}</option>`).join('') : '<option value="">No sessions yet</option>';
    if (!list.some((s) => String(s.id) === adminSel)) adminSel = list[0]?.id ?? ''; pick.value = adminSel; loadBookings();
  } catch (e) { pick.innerHTML = '<option value="">Could not load</option>'; $('#bk').innerHTML = notice('Could not load sessions', e.message); }
}
async function loadBookings(quiet) {
  const box = $('#bk'); if (!box) return;
  if (!adminSel) return void (box.innerHTML = notice('No session selected', 'Create a session to start taking bookings.'));
  if (!quiet) box.innerHTML = skeleton();
  try {
    const d = await api(`/admin/sessions/${adminSel}/bookings`), act = d.bookings.filter((b) => b.status === 'confirmed'), present = act.filter((b) => b.checked_in_at).length;
    box.innerHTML = d.bookings.length ? `<p class="sub" style="margin-bottom:.5rem"><b>${present}</b> of ${act.length} present, ${d.session.seats_left} mats free, ${d.session.waitlist_size} waiting.</p>
      <div class="table-wrap"><table><caption class="sr">Bookings for the selected session</caption><thead><tr><th>Member</th><th>Code</th><th>Status</th></tr></thead><tbody>${d.bookings.map((b) =>
      `<tr><td>${esc(b.name)}<div class="sub">${esc(b.email)}</div></td><td><span class="code">${esc(b.code)}</span></td><td><span class="pill ${b.status === 'cancelled' ? 'bad' : b.checked_in_at ? 'ok' : ''}">${b.status === 'cancelled' ? 'Cancelled' : b.checked_in_at ? 'Present' : 'Not arrived'}</span></td></tr>`).join('')}</tbody></table></div>`
      : notice('No bookings yet', 'Nobody has booked this session.');
    const hint = $('#demo-hint'); if (hint) { const c = d.bookings.find((x) => x.status === 'confirmed' && !x.checked_in_at); hint.textContent = d.session.started && c ? `Demo tip: this session is live. Try code ${c.code}.` : 'Demo tip: choose the "(in progress)" session to find a code that works right now.'; }
  } catch (e) { if (!quiet) box.innerHTML = notice('Could not load bookings', e.message); }
}
async function createSession(ev) {
  ev.preventDefault();
  const date = $('#c-date').value, raw = $('#c-hour').value, hour = Number(raw), errs = {};
  if (!date) errs.date = 'Choose a date.'; if (raw === '' || !Number.isInteger(hour) || hour < 0 || hour > 23) errs.hour = 'Enter a whole hour from 0 to 23.';
  for (const f of ['date', 'hour']) { $('#c-' + f + '-e').textContent = errs[f] ? 'Problem: ' + errs[f] : ''; $('#c-' + f).setAttribute('aria-invalid', !!errs[f]); }
  $('#c-msg').textContent = ''; if (Object.keys(errs).length) return;
  $('#c-btn').disabled = true;
  try { await api('/sessions', 'POST', { date, hour, capacity: 20 }); toast('Session created'); await loadAdminSessions(); }
  catch (e) { $('#c-msg').textContent = 'Problem: ' + e.message; }
  finally { $('#c-btn').disabled = false; }
}
async function checkIn(ev) {
  ev.preventDefault();
  const code = $('#code').value.trim().toUpperCase(), res = $('#k-res'), bad = !/^[A-Z0-9]{6}$/.test(code);
  res.innerHTML = ''; $('#code-e').textContent = bad ? 'Problem: codes have 6 letters or digits.' : ''; $('#code').setAttribute('aria-invalid', bad); if (bad) return;
  $('#k-btn').disabled = true;
  try {
    const d = await api('/admin/checkin', 'POST', { code });
    res.innerHTML = `<div class="result ok"><b>${esc(d.member.name)} is present</b><div>${esc(d.member.email)} · ${esc(shortDate(d.session.date))}, ${hourLabel(d.session.hour)}</div></div>`;
    $('#code').value = ''; loadBookings(true);
  } catch (e) { res.innerHTML = `<div class="result bad">${esc(e.message)}</div>`; }
  finally { $('#k-btn').disabled = false; }
}
router();
</script>
